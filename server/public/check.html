<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check Availability | Hotel Maxx Kohalpur</title>
  <link rel="icon" type="image/png" href="/maxx.png">
  <link rel="stylesheet" href="/css/rooms.css">
  <!-- Socket.io client for real-time updates -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #c19a6b;
      --primary-dark: #a5805a;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 60px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #64748b;
      font-size: 1.1rem;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status-live {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
    }

    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
    }

    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .pulse-green {
      background: #10b981;
      animation: pulse 2s infinite;
    }

    .pulse-red {
      background: #ef4444;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .last-update {
      background: rgba(99, 102, 241, 0.1);
      color: #4f46e5;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.875rem;
    }

    .search-box {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 32px;
    }

    .search-box .form-group {
      flex: 1;
      min-width: 150px;
    }

    .search-box label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }

    .search-box input,
    .search-box select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    .search-box input:focus,
    .search-box select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(193, 154, 107, 0.4);
    }

    .room-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .room-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      border: 1px solid #e2e8f0;
    }

    .room-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    .room-card.unavailable {
      opacity: 0.7;
      border: 2px solid #fbbf24;
    }

    .room-card-content {
      padding: 24px;
    }

    .room-card h3 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
    }

    .room-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .room-info p {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      font-size: 0.95rem;
    }

    .availability-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .badge-available {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
    }

    .badge-limited {
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
    }

    .badge-unavailable {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
    }

    .book-btn {
      width: 100%;
      text-align: center;
    }

    .no-results {
      text-align: center;
      padding: 48px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .no-results p {
      color: #64748b;
      margin-bottom: 12px;
    }

    .suggest-dialog {
      background: linear-gradient(135deg, #fff7ed, #ffedd5);
      border: 2px solid #fed7aa;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }

    .suggest-dialog p {
      color: #9a3412;
      margin-bottom: 16px;
    }

    .suggest-dialog .btn {
      margin: 0 8px;
    }

    .suggest-dialog .btn-secondary {
      background: #e2e8f0;
      color: #475569;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="page-header">
      <h1>🏨 Available Rooms</h1>
      <p>Find and book your perfect stay at Hotel Maxx</p>
    </div>

    <!-- Real-time Status Bar -->
    <div class="status-bar">
      <div id="connectionStatus" class="status-indicator status-offline">
        <span class="pulse pulse-red"></span>
        <span>Connecting...</span>
      </div>
      <div id="lastUpdate" class="last-update">
        Last update: --
      </div>
    </div>

    <!-- Search Box -->
    <div class="search-box" id="searchBox">
      <div class="form-group">
        <label for="checkin">Check-in Date</label>
        <input type="date" id="checkin">
      </div>
      <div class="form-group">
        <label for="checkout">Check-out Date</label>
        <input type="date" id="checkout">
      </div>
      <div class="form-group">
        <label for="adults">Adults</label>
        <select id="adults">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
      <div class="form-group">
        <label for="children">Children</label>
        <select id="children">
          <option selected>0</option>
          <option>1</option>
          <option>2</option>
        </select>
      </div>
      <button class="btn" id="searchBtn">Search Rooms</button>
    </div>

    <div id="availableRooms" class="room-list"></div>
  </div>

  <script>
    // Socket.io for real-time updates
    let socket = null;
    let cachedRooms = [];

    function initSocket() {
      socket = io();

      socket.on('connect', () => {
        updateConnectionStatus(true);
      });

      socket.on('room_update', (data) => {
        cachedRooms = data.rooms || [];
        updateLastUpdateTime(data.time);
        // Re-render if we have search params
        const params = getQueryParams();
        if (params.checkin && params.checkout) {
          fetchAvailable();
        } else {
          renderRooms(cachedRooms, params, 0);
        }
      });

      socket.on('disconnect', () => {
        updateConnectionStatus(false);
      });

      socket.on('connect_error', () => {
        updateConnectionStatus(false);
      });
    }

    function updateConnectionStatus(connected) {
      const statusEl = document.getElementById('connectionStatus');
      if (connected) {
        statusEl.className = 'status-indicator status-live';
        statusEl.innerHTML = '<span class="pulse pulse-green"></span><span>Live Updates</span>';
      } else {
        statusEl.className = 'status-indicator status-offline';
        statusEl.innerHTML = '<span class="pulse pulse-red"></span><span>Reconnecting...</span>';
      }
    }

    function updateLastUpdateTime(time) {
      const el = document.getElementById('lastUpdate');
      const date = new Date(time);
      el.textContent = `Last update: ${date.toLocaleTimeString()}`;
    }

    // Frontend-only capacity rules (do NOT change backend)
    // For all rooms except Triple Deluxe: 2 adults + 1 child (max 3 guests)
    // For Triple Deluxe: 3 adults + 1 child (max 4 guests)
    function getFrontendCapacity(room) {
      const name = (room.name || room.type || '').toLowerCase();
      if (name.includes('triple')) {
        return { adultsMax: 3, childrenMax: 1, totalMax: 4 };
      }
      return { adultsMax: 2, childrenMax: 1, totalMax: 3 };
    }

    function getRoomDisplayName(room) {
      const type = (room.type || room.name || '').toLowerCase();
      if (type.includes('standard')) return 'Standard Suite';
      if (type.includes('deluxe') && !type.includes('triple')) return 'Deluxe Room';
      if (type.includes('junior') || type.includes('suite')) return 'Junior Suite';
      if (type.includes('triple') || type.includes('family')) return 'Triple Deluxe';
      return room.name || room.type || 'Room';
    }

    // When a user chooses 'Add extra bed' from the suggestion dialog we set this
    // and render Book Now links with an extraBed flag in the querystring.
    let extraBedMode = false;

    function getQueryParams() {
      const url = new URL(window.location.href);
      return {
        checkin: url.searchParams.get('checkin'),
        checkout: url.searchParams.get('checkout'),
        adults: url.searchParams.get('adults') || '2',
        children: url.searchParams.get('children') || '0'
      };
    }

    function updateSearchFields(params) {
      if (params.checkin) document.getElementById('checkin').value = params.checkin;
      if (params.checkout) document.getElementById('checkout').value = params.checkout;
      if (params.adults) document.getElementById('adults').value = params.adults;
      if (params.children) document.getElementById('children').value = params.children;
    }

    async function fetchAvailable() {
      const params = getQueryParams();
      const q = new URLSearchParams({
        adults: params.adults,
        children: params.children,
        checkin: params.checkin || '',
        checkout: params.checkout || ''
      });

      let payload = { rooms: [], maxSingleCapacity: 0 };

      try {
        const res = await fetch(`/api/rooms/available?${q.toString()}`);
        if (res.ok) {
          payload = await res.json();
        }
      } catch (e) {
        console.error('Error fetching availability:', e);
      }

      let rooms = payload.rooms || [];

      // If empty, fallback to cached rooms or fetch all
      if (!rooms || rooms.length === 0) {
        if (cachedRooms.length > 0) {
          rooms = cachedRooms;
        } else {
          try {
            const allRes = await fetch('/api/rooms');
            if (allRes.ok) {
              rooms = await allRes.json();
              cachedRooms = rooms;
            }
          } catch (e) {
            console.error('Error fetching all rooms:', e);
          }
        }
      }

      renderRooms(rooms, params, payload.maxSingleCapacity);
    }

    function renderRooms(rooms, params, maxSingleCapacityOverride) {
      const container = document.getElementById('availableRooms');
      container.innerHTML = '';

      if (!rooms || rooms.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <p style="font-size: 3rem; margin-bottom: 16px;">🏨</p>
            <p style="font-size: 1.2rem; font-weight: 600; color: #1e293b;">No rooms available</p>
            <p>Please try different dates or contact our reception.</p>
          </div>`;
        return;
      }

      // Check if guests exceed capacity using frontend rules
      const guests = Number(params.adults || 0) + Number(params.children || 0);

      const maxSingleCapacity = typeof maxSingleCapacityOverride === 'number' && maxSingleCapacityOverride > 0
        ? maxSingleCapacityOverride
        : rooms.reduce((max, r) => Math.max(max, getFrontendCapacity(r).totalMax), 0);

      if (guests > maxSingleCapacity) {
        const suggest = document.createElement('div');
        suggest.className = 'suggest-dialog';
        suggest.innerHTML = `
          <p style="font-size: 1.1rem; font-weight: 600;">👥 ${guests} guests exceeds single room capacity (max ${maxSingleCapacity})</p>
          <p>You can either book multiple rooms or add an extra bed for रु 500 where available.</p>
          <button class="btn" id="twoRoomsYes">Yes, show options (multiple rooms)</button>
          <button class="btn" id="extraBedBtn">Yes, allow extra bed (रु 500)</button>
          <button class="btn btn-secondary" id="twoRoomsNo">No thanks</button>
        `;
        container.appendChild(suggest);

        document.getElementById('twoRoomsYes').addEventListener('click', () => {
          const sorted = rooms.slice().sort((a, b) => (b.available || 0) - (a.available || 0));
          container.innerHTML = '';
          sorted.slice(0, 4).forEach(room => renderRoomCard(room, params, container));
        });

        document.getElementById('extraBedBtn').addEventListener('click', () => {
          // Enter extra-bed mode and show options; Book links will include extraBed=1
          extraBedMode = true;
          container.innerHTML = '';
          rooms.forEach(room => renderRoomCard(room, params, container));
        });

        document.getElementById('twoRoomsNo').addEventListener('click', () => {
          container.innerHTML = `
            <div class="no-results">
              <p style="font-size: 3rem; margin-bottom: 16px;">💁</p>
              <p style="font-size: 1.2rem; font-weight: 600; color: #1e293b;">Need special arrangements?</p>
              <p>Contact our reception for personalized assistance with large groups.</p>
            </div>`;
        });
        return;
      }

      rooms.forEach(room => renderRoomCard(room, params, container));
    }

    function renderRoomCard(room, params, container) {
      const slug = (room.name || room.type || 'room').replace(/\s+/g, '-').toLowerCase();
      const availableCount = room.available ?? room.availableRooms ?? 0;
      const isAvailable = availableCount > 0;

      let badgeClass = 'badge-available';
      let badgeText = `${availableCount} rooms available`;

      if (availableCount === 0) {
        badgeClass = 'badge-unavailable';
        badgeText = 'No rooms available';
      } else if (availableCount <= 2) {
        badgeClass = 'badge-limited';
        badgeText = `Only ${availableCount} left!`;
      }

      const cap = getFrontendCapacity(room);
      const roomTitle = getRoomDisplayName(room);

      // Determine if this room can accommodate current guests with an extra bed
      const guests = Number(params.adults || 0) + Number(params.children || 0);
      const canWithExtra = guests <= (cap.totalMax + 1);
      const needsExtra = guests > cap.totalMax && guests <= (cap.totalMax + 1);

      const capacityText = `Max ${cap.adultsMax} Adults${cap.childrenMax ? ' + ' + cap.childrenMax + ' Child' : ''} (Max ${cap.totalMax} Guests)`;

      const card = document.createElement('div');
      card.className = `room-card ${!isAvailable ? 'unavailable' : ''}`;
      card.innerHTML = `
        <div class="room-card-content">
          <h3>${roomTitle}</h3>
          <div class="availability-badge ${badgeClass}">
            ${availableCount > 0 ? '✓' : '✕'} ${badgeText}
          </div>
          <div class="room-info">
            <p>🛏️ ${room.bed || 'Comfortable Bed'}</p>
            <p>👥 ${capacityText}</p>
            <p>💰 रु ${room.price ? Number(room.price).toLocaleString() : '—'} / night</p>
            ${room.description ? `<p>📝 ${room.description}</p>` : ''}
          </div>
          ${isAvailable ? `
            <a class="btn book-btn" href="/booking.html?room=${encodeURIComponent(slug)}&checkin=${encodeURIComponent(params.checkin || '')}&checkout=${encodeURIComponent(params.checkout || '')}&adults=${encodeURIComponent(params.adults || '')}&children=${encodeURIComponent(params.children || '')}${extraBedMode && needsExtra ? '&extraBed=1' : ''}">
              Book Now
            </a>
            ${needsExtra ? `<p style="margin-top:8px; color:#b45309; font-weight:600;">⚠️ This request exceeds the normal capacity — an extra bed (रु 500) can accommodate your party.</p>` : (guests > cap.totalMax ? `<p style="margin-top:8px; color:#b45309; font-weight:600;">⚠️ This request exceeds capacity even with an extra bed. Consider booking multiple rooms.</p>` : '')}
          ` : `
            <button class="btn book-btn" disabled style="opacity: 0.5; cursor: not-allowed;">
              Currently Unavailable
            </button>
          `}
        </div>
      `;
      container.appendChild(card);
    }

    function toMidnight(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr + 'T00:00:00');
      return isNaN(d.getTime()) ? null : d;
    }

    // Search button handler
    document.getElementById('searchBtn').addEventListener('click', () => {
      const checkin = document.getElementById('checkin').value;
      const checkout = document.getElementById('checkout').value;
      const adults = document.getElementById('adults').value;
      const children = document.getElementById('children').value;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const ci = toMidnight(checkin);
      const co = toMidnight(checkout);

      if (ci && ci < today) {
        alert('Check-in cannot be before today');
        return;
      }
      if (co && co <= today) {
        alert('Check-out must be after today');
        return;
      }
      if (ci && co && co <= ci) {
        alert('Check-out date must be after check-in date');
        return;
      }

      const qs = new URLSearchParams({ checkin, checkout, adults, children });
      window.history.replaceState({}, '', window.location.pathname + '?' + qs.toString());
      fetchAvailable();
    });

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      initSocket();

      const params = getQueryParams();
      updateSearchFields(params);

      // Auto-search if params present
      if (params.checkin && params.checkout) {
        fetchAvailable();
      } else {
        // Just fetch all rooms to show
        fetch('/api/rooms')
          .then(r => r.json())
          .then(rooms => {
            cachedRooms = rooms;
            renderRooms(rooms, params, 0);
          })
          .catch(err => console.error('Error loading rooms:', err));
      }
    });
  </script>
</body>

</html>
